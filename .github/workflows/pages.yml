# Déploie le dashboard statique (dashboard/ + portfolio_state.json) sur GitHub Pages :
#   - à chaque push sur master touchant le dashboard ou l'état
#   - après chaque exécution du Trading Bot (ses commits, poussés avec
#     GITHUB_TOKEN, ne déclenchent pas d'événement push)
#   - manuellement
name: Pages Deploy

on:
  push:
    branches: [master]
    paths:
      - 'dashboard/**'
      - 'portfolio_state.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Trading Bot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Build site
        run: |
          mkdir -p .gh-pages
          cp -r dashboard/* .gh-pages/
          cp portfolio_state.json .gh-pages/
          touch .gh-pages/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .gh-pages/

      # GitHub échoue régulièrement à ce stade (« Fetching artifact metadata failed »,
      # « Deployment failed, try again later » : 6 déploiements sur 51 en novembre 2026).
      # Ces erreurs sont passagères : on retente deux fois avant d'abandonner.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pause avant 2e essai
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2e essai)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pause avant 3e essai
        if: steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (3e essai)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
