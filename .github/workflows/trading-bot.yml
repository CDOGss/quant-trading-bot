# ============================================================
# Trading Bot – Paper Trading (GitHub Actions)
# ============================================================
# Déclencheurs :
#   - workflow_dispatch par cron-job.org : déclencheur PRINCIPAL, lun-ven
#                10h17/12h17/14h17/16h17 heure de Paris (voir docs/declenchement-externe.md)
#   - schedule : SECOURS seulement (le cron GitHub partait avec ~5 h de retard en
#                sept. 2026). trader.py (RUN_MODE=secours) ne trade que si aucun
#                passage depuis 150 min, et jamais hors séance ni jour férié.
#   - push sur master touchant engine/ (re-test)
#   - workflow_dispatch (manuel, onglet Actions)
# Après chaque exécution, pages.yml redéploie le dashboard (workflow_run).
# ============================================================

name: Trading Bot

on:
  schedule:
    - cron: '47 8,10,12,14 * * 1-5'
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - '.github/workflows/trading-bot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = Gemini si GEMINI_API_KEY est défini, rules = règles techniques'
        type: choice
        options: [auto, rules]
        default: auto

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    name: "Execute Trading Decision"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: "Self-test (mock Gemini)"
        working-directory: engine
        run: python _test_gemini.py

      - name: "Run Trading Engine"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'high' }}
          MAX_POSITION_SIZE: ${{ vars.MAX_POSITION_SIZE || '25' }}
          MIN_TRADE_SIZE: ${{ vars.MIN_TRADE_SIZE || '100' }}
          INITIAL_CAPITAL: ${{ vars.INITIAL_CAPITAL || '10000' }}
          ASK_BASKET: ${{ vars.ASK_BASKET }}
          SKIP_GEMINI: ${{ github.event.inputs.mode == 'rules' && 'true' || '' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'secours' || 'principal' }}
        working-directory: engine
        run: python trader.py

      - name: "Commit & push portfolio_state.json"
        run: |
          git config user.name "Trading Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet portfolio_state.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add portfolio_state.json
          git commit -m "📈 Trading update – $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
